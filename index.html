<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造型時間線</title>
    <style>
        :root { --bg: #fdfcf8; --china: #c0392b; --taiwan: #27ae60; --west: #2980b9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); font-family: sans-serif; overflow-x: hidden; }
        header { position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.95); padding: 15px; text-align: center; z-index: 1000; border-bottom: 1px solid #ddd; }
        .legend { display: flex; justify-content: center; gap: 15px; font-size: 13px; margin-top: 5px; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        #timeline-wrapper { position: relative; width: 100%; margin-top: 100px; min-height: 5000px; padding-bottom: 500px; }
        .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #ccc; transform: translateX(-50%); }
        .item { position: absolute; width: 140px; padding: 8px; border-radius: 5px; font-size: 12px; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.4); box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .china { text-align: right; border-right: 4px solid var(--china); right: calc(50% + 20px); }
        .taiwan { text-align: left; border-left: 4px solid var(--taiwan); left: calc(50% + 20px); }
        .west { text-align: left; border-left: 4px solid var(--west); left: calc(50% + 170px); }
        #note-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; }
        .note-container { max-width: 90%; margin: 15vh auto; background: white; padding: 20px; border-radius: 15px; }
        #note-content { font-size: 16px; line-height: 1.6; white-space: pre-wrap; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 10px; }
        .close-btn { margin-top: 15px; padding: 10px; background: #333; color: white; border: none; border-radius: 5px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>造型時間線</h1>
        <div class="legend">
            <span><span class="dot" style="background:var(--china)"></span>古中國</span>
            <span><span class="dot" style="background:var(--taiwan)"></span>臺灣</span>
            <span><span class="dot" style="background:var(--west)"></span>西方</span>
        </div>
    </header>
    <div id="timeline-wrapper"><div class="center-line"></div></div>
    <div id="note-view" onclick="this.style.display='none'">
        <div class="note-container" onclick="event.stopPropagation()">
            <h2 id="note-title"></h2>
            <div id="note-content"></div>
            <button class="close-btn" onclick="document.getElementById('note-view').style.display='none'">關閉</button>
        </div>
    </div>
<script>
    const notesData = { "長濱文化": "台灣已知最早文化，打製石器。", "大坌坑文化": "台灣新石器起源，繩紋陶器。", "商": "青銅文明，饕餮紋、莊嚴神秘。", "包浩斯": "現代設計起源，形隨機能。" };
    const SCALE = 3;
    function getY(year) {
        if (year < -10000) return (year + 28000) * 0.05; 
        return 1000 + (year + 10000) * SCALE;
    }
    const data = [
        {n:"長濱文化",s:-28000,e:-13000,t:"taiwan",c:140},
        {n:"大坌坑文化",s:-5000,e:-3000,t:"taiwan",c:140},
        {n:"商",s:-1600,e:-1046,t:"china",c:15},
        {n:"唐",s:618,e:907,t:"china",c:15},
        {n:"包浩斯",s:1919,e:1933,t:"west",c:210}
    ];
    data.forEach(item => {
        const el = document.createElement('div');
        el.className = `item ${item.t}`;
        const topY = getY(item.s);
        el.style.top = topY + 'px';
        el.style.height = Math.max((item.e - item.s) * (item.s < -10000 ? 0.05 : SCALE), 35) + 'px';
        el.style.backgroundColor = `hsl(${item.c}, 60%, 90%)`;
        el.innerHTML = `<strong>${item.n}</strong><br>${item.s}~${item.e}`;
        el.onclick = () => {
            document.getElementById('note-title').innerText = item.n;
            document.getElementById('note-content').innerText = notesData[item.n] || "尚無詳細筆記，快去 GitHub 增加內容吧！";
            document.getElementById('note-view').style.display = "block";
        };
        document.getElementById('timeline-wrapper').appendChild(el);
    });
</script>
</body>
</html>
